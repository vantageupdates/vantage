[project]
name = "vantage"
version = "1.44.46"
authors = [
  { name="Vantage contributors" },
]
description = "Vantage: smart timers, maps, buffs, combat, heal chains and Green market tools for Project 1999."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
  'PySide6',
  'colorhash',
  'pathvalidate',
  'semver',
  'segno',
]

[project.optional-dependencies]
build = [
  'pyinstaller>=6.18',
]
tests = [
  'pytest-cov',
]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = [
    "--import-mode=importlib",
]
